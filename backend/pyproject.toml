[project]
name = "praxis-p1-backend"
version = "0.1.0"
description = "Praxis P1 - LangGraph weather agent streamed over SSE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "langgraph>=1.2",
    "langchain-openai>=1.6",
    "pydantic-settings>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
